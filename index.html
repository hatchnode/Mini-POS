<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2328" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Mini-POS</title>
  </head>
  <body>
    <header class="top">
      <div class="brand"><small>Mini-POS</small><span id="brand-name"></span></div>
      <nav aria-label="Sections">
        <button data-act="view" data-view="orders">Orders</button>
        <button data-act="view" data-view="kitchen">
          Kitchen<span class="badge" id="kitchen-badge" hidden></span>
        </button>
        <button data-act="view" data-view="sales">Sales</button>
        <button data-act="view" data-view="menu">Menu</button>
        <button data-act="view" data-view="settings">Settings</button>
      </nav>
      <div class="clock" id="clock"></div>
    </header>
    <div id="storage-banner" class="banner" hidden>
      Browser storage is unavailable here, so data will be lost when this page closes. Open the app in Chrome,
      Edge or Safari.
    </div>
    <main id="app"></main>
    <div id="modal-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="print-area"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
